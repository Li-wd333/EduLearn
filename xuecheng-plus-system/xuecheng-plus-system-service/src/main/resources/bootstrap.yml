spring:
  application:
    name: system-service  #服务名
  cloud:
    nacos: #配置nacos
      server-addr: 192.168.101.65:8848
      config:  #配置文件相关配置
        namespace: dev402
        group: xuecheng-plus-project
        file-extension: yaml
        refresh-enabled: true #配置文件是否动态刷新
  profiles:
    active: dev #环境名
mybatis-plus:
