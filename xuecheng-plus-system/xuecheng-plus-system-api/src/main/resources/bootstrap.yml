#微服务配置
spring:
  application:
    name: system-api #服务名system-api-dev.yaml
  profiles: #指定环境
    active: dev
  cloud:
    nacos:
      server-addr: 192.168.101.65:8848  # nacos地址
      discovery:  # 注册服务相关配置
        namespace: dev402
        group: xuecheng-plus-project
      config:   # 配置文件相关配置
        namespace: dev402
        group: xuecheng-plus-project
        file-extension: yaml
        refresh-enabled: true
        #扩展配置
        extension-configs:
          - data-id: system-service-${spring.profiles.active}.yaml
            group: xuecheng-plus-project
            refresh: true
        #共享配置
        shared-configs:
          - data-id: swagger-${spring.profiles.active}.yaml
            group: xuecheng-plus-common
            refresh: true
          - data-id: logging-${spring.profiles.active}.yaml
            group: xuecheng-plus-common
            refresh: true
